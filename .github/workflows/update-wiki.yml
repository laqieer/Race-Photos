name: Update wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/images/**'
      - '.github/scripts/generate_wiki.py'
      - '.github/workflows/update-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-wiki
  cancel-in-progress: false

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone wiki repository
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN="${WIKI_TOKEN:-$DEFAULT_TOKEN}"
          git clone "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Generate wiki content
        run: |
          python .github/scripts/generate_wiki.py \
            --manifest docs/images/manifest.json \
            --output wiki

      - name: Commit and push wiki changes
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Sync wiki with manifest"
            git push
            echo "✓ Pushed wiki update"
          else
            echo "No wiki changes to sync"
          fi
